# Local development - builds from source with debug enabled
services:
  shelfmark-dev:
    extends:
      file: ./compose/docker-compose.yml
      service: shelfmark
    build:
      context: .
      dockerfile: Dockerfile
      target: shelfmark
    cap_add:
      - SYS_PTRACE
    extra_hosts:
      # Lets the container reach services on the Docker host by name,
      # e.g. a SearXNG instance at http://host.docker.internal:47821.
      - "host.docker.internal:host-gateway"
    # Send all name lookups (Chrome and subprocesses too, not only the in-app
    # resolver) to the quietsearx CoreDNS container, which forwards them to
    # Mullvad over DNS-over-TLS. `make up` starts quietsearx first.
    networks:
      - default
      - quietsearx
    dns:
      - 172.30.0.53
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: true
      # HIDE_LOCAL_AUTH: true
      OIDC_AUTO_REDIRECT: true
    volumes:
      - ./.local/config:/config
      - ./.local/books:/books
      - ./.local/log:/var/log/shelfmark
      - ./.local/tmp:/tmp/shelfmark
      - ./shelfmark:/app/shelfmark:ro
      - ./frontend-dist:/app/frontend-dist:ro
      # Required for torrent / usenet - path must match your download client's volume exactly
      # - /path/to/downloads:/path/to/downloads

networks:
  quietsearx:
    external: true
    name: quietsearx_searxng
